name: Android regression checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: actions/cache@v4
        with:
          path: |
            work/deps
            work/watch-wakeword-assets
          key: android-deps-${{ hashFiles('tools/dependencies.lock.json', 'tools/watch-wakeword-model.lock.json') }}
      - name: Install build platforms
        run: |
          sdkmanager 'platforms;android-26' 'platforms;android-34' 'build-tools;34.0.0' 'platform-tools'
          echo "BUILD_TOOLS=$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_ENV"
          echo "ANDROID_JAR_26=$ANDROID_HOME/platforms/android-26/android.jar" >> "$GITHUB_ENV"
          echo "ANDROID_JAR_34=$ANDROID_HOME/platforms/android-34/android.jar" >> "$GITHUB_ENV"
      - name: Build both applications and phone tests
        run: |
          set -euo pipefail
          python3 tools/fetch-dependencies.py
          bash tools/build-android.sh phone
          bash tools/build-android.sh watch
          bash tests/android/build.sh phone
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Synthetic phone regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          avd-name: ci-disposable
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: python3 tests/android/run-regressions.py --serial emulator-5554 --avd ci-disposable --install
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: work/process-optimization/results
          if-no-files-found: ignore
