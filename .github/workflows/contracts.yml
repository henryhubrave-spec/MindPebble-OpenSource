name: Contract checks
on: [push, pull_request, workflow_dispatch]
jobs:
  contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s packages/contracts/tests -v
      - run: python -m unittest discover -s experiments/speech-retention/tests -v
      - run: python -m unittest discover -s tests/agent -v
      - run: python tools/prepare-open-source.py --dest work/public-review
# No deployment, model calls, real recordings, or signing secrets.
